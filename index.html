<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Weather Application</h1>

    <div class="forms">

        <!-- Search by City -->
        <div class="card">

            <h2>Search by Location</h2>

            <form action="script.js" id="locationForm">

                <label for="location">City or Location</label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="New York"
                    required
                >

                <button type="submit">
                    Search Weather
                </button>

            </form>

        </div>

        <!-- Search by Coordinates -->
        <div class="card">

            <h2>Search by Coordinates</h2>

            <form action="script.js" id="coordinatesForm">

                <label for="latitude">Latitude</label>

                <input
                    type="number"
                    step="any"
                    id="latitude"
                    name="latitude"
                    placeholder="40.7128"
                    required
                >

                <label for="longitude">Longitude</label>

                <input
                    type="number"
                    step="any"
                    id="longitude"
                    name="longitude"
                    placeholder="-74.0060"
                    required
                >

                <button type="submit">
                    Search Weather
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
